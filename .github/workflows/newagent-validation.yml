name: NewAgent validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Track the Node 22 LTS line (same major as the api Dockerfile's
          # node:22-alpine and the root @types/node ^22) instead of pinning an
          # exact patch, so the runner always resolves a published Linux build.
          node-version: '22.x'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Workspace types and tests
        run: npm run check
      - name: Build API
        run: npm run build --workspace=@valorant/api
      - name: HTTP liveness and readiness
        run: node .github/scripts/health-integration.mjs --http
